<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASN.1 Graph Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      body {
        background: #fafafa;
      }

      asn1-graph-viewer {
        width: 100%;
        height: 100%;
      }

      .watermark {
        position: fixed;
        bottom: 20px;
        left: 20px;
        color: rgba(0, 0, 0, 0.3);
        font-size: 14px;
        font-weight: 500;
        pointer-events: none;
        z-index: 100;
      }

      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #666;
      }

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .welcome-message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #666;
        max-width: 500px;
        padding: 40px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      .welcome-message h1 {
        color: #333;
        margin-bottom: 16px;
        font-size: 28px;
      }

      .welcome-message p {
        line-height: 1.6;
        margin-bottom: 12px;
      }

      .welcome-icon {
        font-size: 64px;
        margin-bottom: 20px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Welcome Message -->
    <div class="welcome-message" id="welcomeMessage">
      <div class="welcome-icon">📊</div>
      <h1>ASN.1 Graph Viewer</h1>
      <p>Click the menu icon (☰) in the top-left corner to get started.</p>
      <p>Paste your hex-encoded ASN.1 data and click decode to visualize it as an interactive graph.</p>
    </div>

    <!-- Graph Viewer (full screen) -->
    <asn1-graph-viewer id="graphViewer"></asn1-graph-viewer>

    <!-- Floating Control Panel -->
    <asn1-control-panel id="controlPanel"></asn1-control-panel>

    <!-- Watermark -->
    <div class="watermark">ASN.1 Graph Viewer</div>

    <!-- Load D3.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <!-- Load Web Components and Libraries -->
    <script type="module">
      import { ASN1 } from "https://unpkg.com/@lapo/asn1js@2.0.0/asn1.js";
      import { Hex } from "https://unpkg.com/@lapo/asn1js@2.0.0/hex.js";
      import { ASN1GraphViewer } from "./asn1-graph-viewer.js";
      import { ASN1ControlPanel } from "./asn1-control-panel.js";

      // Make ASN1 and Hex available globally for the web components
      window.ASN1 = ASN1;
      window.Hex = Hex;

      console.log("✅ All libraries and components loaded");

      const graphViewer = document.getElementById("graphViewer");
      const controlPanel = document.getElementById("controlPanel");
      const welcomeMessage = document.getElementById("welcomeMessage");

      // Set graph dimensions
      graphViewer.setAttribute("width", window.innerWidth);
      graphViewer.setAttribute("height", window.innerHeight);

      // Listen for decoded data events
      controlPanel.addEventListener("decoded", (event) => {
        const data = event.detail.data;
        graphViewer.setData(data);

        // Hide welcome message once data is loaded
        welcomeMessage.classList.add("hidden");
      });

      // Listen for edge labels toggle
      controlPanel.addEventListener("edgeLabelsChanged", (event) => {
        graphViewer.setEdgeLabels(event.detail.show);
      });

      // Listen for spacing changes
      controlPanel.addEventListener("spacingChanged", (event) => {
        graphViewer.setSpacing(event.detail.spacing, event.detail.spacing * 2.5);
      });

      // Handle window resize
      window.addEventListener("resize", () => {
        graphViewer.setAttribute("width", window.innerWidth);
        graphViewer.setAttribute("height", window.innerHeight);
        graphViewer.handleResize();
      });

      // Keyboard shortcuts
      document.addEventListener("keydown", (e) => {
        // Ctrl/Cmd + K to toggle control panel
        if ((e.ctrlKey || e.metaKey) && e.key === "k") {
          e.preventDefault();
          const toggleBtn = controlPanel.shadowRoot.getElementById("toggleBtn");
          toggleBtn.click();
        }

        // Escape to close control panel
        if (e.key === "Escape") {
          const panel = controlPanel.shadowRoot.getElementById("panel");
          if (panel.classList.contains("open")) {
            const toggleBtn = controlPanel.shadowRoot.getElementById("toggleBtn");
            toggleBtn.click();
          }
        }
      });

      console.log("ASN.1 Graph Viewer initialized");
      console.log("Keyboard shortcuts:");
      console.log("  Ctrl/Cmd + K: Toggle control panel");
      console.log("  Escape: Close control panel");
    </script>
  </body>
</html>
