<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: monospace;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin: 0;
      }
      #topRow {
        display: flex;
        gap: 20px;
      }
      #leftPanel {
        flex: 1;
      }
      #rightPanel {
        flex: 1;
        border-left: 2px solid #ccc;
        padding-left: 20px;
      }
      #graphPanel {
        width: 100%;
        border-top: 2px solid #ccc;
        padding-top: 20px;
      }
      #graphContainer {
        width: 100%;
        height: 600px;
        border: 1px solid #ccc;
        overflow: auto;
        background: #f9f9f9;
      }
      #graph {
        width: 100%;
        min-height: 600px;
      }
      #hexInput {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
      }
      #decodeBtn {
        padding: 8px 16px;
        margin-bottom: 20px;
      }
      #output {
        white-space: pre-wrap;
        font-size: 12px;
      }
      #labelForm {
        margin-bottom: 20px;
      }
      .label-row {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
        align-items: flex-start;
        padding: 8px;
        border: 1px solid #eee;
        border-radius: 4px;
      }
      .label-row input {
        flex: 1;
        padding: 4px;
      }
      .tree-node {
        margin: 5px 0;
        padding: 8px;
        border-left: 3px solid #ccc;
        background: white;
      }
      .tree-node-header {
        display: flex;
        gap: 10px;
        align-items: center;
        cursor: pointer;
      }
      .tree-node-type {
        font-weight: bold;
        color: #0066cc;
      }
      .tree-node-details {
        color: #666;
        font-size: 11px;
      }
      .tree-node-content {
        color: #009900;
        font-size: 11px;
        margin-top: 4px;
        padding: 4px;
        background: #f0f0f0;
        border-radius: 3px;
        max-width: 800px;
        word-wrap: break-word;
      }
      .tree-node-children {
        margin-left: 20px;
      }
      .tree-node-toggle {
        user-select: none;
        width: 20px;
        text-align: center;
      }
      .tree-node-collapsed .tree-node-children {
        display: none;
      }
      h3 {
        margin-top: 0;
      }
      #saveLabels,
      #clearLabels {
        padding: 8px 16px;
        margin-right: 10px;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gojs"></script>
  </head>
  <body>
    <div id="topRow">
      <div id="leftPanel">
        <h3>ASN.1 Decoder</h3>
        <input id="hexInput" placeholder="Paste hex here" />
        <button id="decodeBtn">Decode</button>
        <button id="copyBtn">Copy JSON</button>
        <pre id="output"></pre>
      </div>

      <div id="rightPanel">
        <h3>Custom Labels</h3>
        <div id="labelForm"></div>
        <button id="saveLabels">Apply Labels</button>
        <button id="clearLabels">Clear All Labels</button>
      </div>
    </div>
    <div id="myContainer"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <script type="module">
      import { ASN1 } from "https://unpkg.com/@lapo/asn1js@2.0.0/asn1.js";
      import { Hex } from "https://unpkg.com/@lapo/asn1js@2.0.0/hex.js";
      import { parser } from "./bundle.js";
      import { JsonToD3Graph } from "./json-to-go.js";

      // create the model data that will be represented by Nodes and Links
      const input = document.getElementById("hexInput");
      const output = document.getElementById("output");
      const btn = document.getElementById("decodeBtn");
      const copyBtn = document.getElementById("copyBtn");
      const labelForm = document.getElementById("labelForm");
      const saveLabelsBtn = document.getElementById("saveLabels");
      const clearLabelsBtn = document.getElementById("clearLabels");
      const graphContainer = document.getElementById("graph");

      let customLabels = {};
      let allNodes = [];
      let unknownTypes = new Set();

      function getASN1TypeName(tagClass, tagNumber, tagConstructed) {
        // Check for custom label first
        const key = `${tagClass}-${tagNumber}-${tagConstructed}`;
        if (customLabels[key]) {
          return customLabels[key];
        }

        // Universal class tags (tagClass === 0)
        if (tagClass === 0) {
          const universalTags = {
            1: "BOOLEAN",
            2: "INTEGER",
            3: "BIT STRING",
            4: "OCTET STRING",
            5: "NULL",
            6: "OBJECT IDENTIFIER",
            7: "ObjectDescriptor",
            8: "EXTERNAL",
            9: "REAL",
            10: "ENUMERATED",
            11: "EMBEDDED PDV",
            12: "UTF8String",
            13: "RELATIVE-OID",
            16: "SEQUENCE",
            17: "SET",
            18: "NumericString",
            19: "PrintableString",
            20: "T61String",
            21: "VideotexString",
            22: "IA5String",
            23: "UTCTime",
            24: "GeneralizedTime",
            25: "GraphicString",
            26: "VisibleString",
            27: "GeneralString",
            28: "UniversalString",
            30: "BMPString",
          };
          return universalTags[tagNumber] || `Universal_${tagNumber}`;
        }

        // Context-specific (tagClass === 2)
        if (tagClass === 2) {
          return `[${tagNumber}]${tagConstructed ? " CONSTRUCTED" : ""}`;
        }

        // Application (tagClass === 1)
        if (tagClass === 1) {
          return `APPLICATION ${tagNumber}${
            tagConstructed ? " CONSTRUCTED" : ""
          }`;
        }

        // Private (tagClass === 3)
        if (tagClass === 3) {
          return `PRIVATE ${tagNumber}${tagConstructed ? " CONSTRUCTED" : ""}`;
        }

        return "UNKNOWN";
      }

      function getBaseUniversalType(node) {
        // For context-specific tags, try to infer the base type from content
        if (!node.sub && node.content) {
          // Primitive content - try to guess type
          const content =
            typeof node.content === "function" ? node.content() : node.content;

          // Check if it looks like an integer
          if (typeof content === "string" && content.match(/^\([\d]+ byte\)/)) {
            const hex = content.split("\n")[1];
            if (hex && hex.length <= 8) {
              return "INTEGER";
            }
            return "OCTET STRING";
          }

          // Check if it looks like printable text
          if (
            typeof content === "string" &&
            content.match(/^[a-zA-Z0-9\s]+$/)
          ) {
            return "PrintableString/UTF8String";
          }
        }

        // For constructed types, check if children suggest SEQUENCE or SET
        if (node.sub && node.sub.length > 0) {
          return "SEQUENCE/SET";
        }

        return null;
      }

      function collectUnknownTypes(node) {
        const typeName = getASN1TypeName(
          node.tag?.tagClass,
          node.tag?.tagNumber,
          node.tag?.tagConstructed
        );

        // Collect context-specific, application, and private tags
        if (
          node.tag?.tagClass === 2 ||
          node.tag?.tagClass === 1 ||
          node.tag?.tagClass === 3
        ) {
          const baseType = getBaseUniversalType(node);
          const key = `${node.tag.tagClass}-${node.tag.tagNumber}-${node.tag.tagConstructed}`;
          unknownTypes.add(
            JSON.stringify({
              key,
              tagClass: node.tag.tagClass,
              tagNumber: node.tag.tagNumber,
              tagConstructed: node.tag.tagConstructed,
              currentName: typeName,
              baseType: baseType,
            })
          );
        }

        if (node.sub && node.sub.length > 0) {
          node.sub.forEach(collectUnknownTypes);
        }
      }

      function serializeNode(node, depth = 0) {
        const typeName = getASN1TypeName(
          node.tag?.tagClass,
          node.tag?.tagNumber,
          node.tag?.tagConstructed
        );
        const baseType =
          node.tag?.tagClass === 2 ||
          node.tag?.tagClass === 1 ||
          node.tag?.tagClass === 3
            ? getBaseUniversalType(node)
            : null;

        const obj = {
          type: typeName,
          tagClass: node.tag?.tagClass,
          tagNumber: node.tag?.tagNumber,
          tagConstructed: node.tag?.tagConstructed,
          length: node.length,
        };

        if (baseType) {
          obj.baseType = baseType;
        }

        if (node.sub && node.sub.length > 0) {
          obj.subCount = node.sub.length;
          obj.sub = node.sub.map((n) => serializeNode(n, depth + 1));
        } else if (node.content !== undefined) {
          obj.content =
            typeof node.content === "function" ? node.content() : node.content;
        }

        return obj;
      }

      function renderLabelForm() {
        labelForm.innerHTML = "";

        if (unknownTypes.size === 0) {
          labelForm.innerHTML =
            "<p>No unlabeled tags found. Decode some ASN.1 data first.</p>";
          return;
        }

        const types = Array.from(unknownTypes).map((s) => JSON.parse(s));
        types.forEach((type) => {
          const row = document.createElement("div");
          row.className = "label-row";

          const label = document.createElement("div");
          label.style.width = "250px";
          label.style.fontSize = "11px";

          const mainName = document.createElement("div");
          mainName.textContent = type.currentName;
          mainName.style.fontWeight = "bold";
          label.appendChild(mainName);

          const details = document.createElement("div");
          details.style.color = "#666";
          details.style.fontSize = "10px";
          details.textContent = `Class: ${type.tagClass}, Tag: ${
            type.tagNumber
          }, ${type.tagConstructed ? "Constructed" : "Primitive"}`;

          if (type.baseType) {
            const baseType = document.createElement("div");
            baseType.style.color = "#009900";
            baseType.textContent = `Base: ${type.baseType}`;
            label.appendChild(baseType);
          }

          label.appendChild(details);

          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = "Enter custom label";
          input.value = customLabels[type.key] || "";
          input.dataset.key = type.key;

          row.appendChild(label);
          row.appendChild(input);
          labelForm.appendChild(row);
        });
      }

      btn.onclick = () => {
        try {
          const hex = input.value.trim().replace(/\s/g, "");
          console.log("Hex length:", hex.length);

          const bytes = Hex.decode(hex);
          console.log("Bytes length:", bytes.length);

          // Collect all top-level elements by slicing the array
          allNodes = [];
          unknownTypes = new Set();
          let pos = 0;
          while (pos < bytes.length) {
            try {
              const remaining = bytes.slice(pos);
              const node = ASN1.decode(remaining);
              allNodes.push(node);
              collectUnknownTypes(node);
              const nodeEnd = node.posEnd();
              pos += nodeEnd;
              console.log("Decoded node, now at position:", pos);
            } catch (e) {
              console.log("Stopped at position:", pos, "Error:", e.message);
              break;
            }
          }

          console.log("Total top-level nodes:", allNodes.length);
          const serialized = allNodes.map((n) => serializeNode(n));
          output.textContent = JSON.stringify(serialized, null, 2);
          renderLabelForm();
          const graph = new JsonToD3Graph("myContainer", {
            width: 1200,
            height: 800,
            levelSeparation: 150,
          });

          graph.renderJson(serialized);
        } catch (e) {
          console.error("Decode error:", e);
          output.textContent = "Error: " + e.message + "\n" + e.stack;
        }
      };

      saveLabelsBtn.onclick = () => {
        const inputs = labelForm.querySelectorAll("input[data-key]");
        inputs.forEach((input) => {
          const key = input.dataset.key;
          const value = input.value.trim();
          if (value) {
            customLabels[key] = value;
          } else {
            delete customLabels[key];
          }
        });

        // Re-render with new labels
        const serialized = allNodes.map((n) => serializeNode(n));
        output.textContent = JSON.stringify(serialized, null, 2);
        renderLabelForm();
      };

      clearLabelsBtn.onclick = () => {
        customLabels = {};
        const serialized = allNodes.map((n) => serializeNode(n));
        output.textContent = JSON.stringify(serialized, null, 2);
        renderLabelForm();
      };

      copyBtn.onclick = async () => {
        try {
          await navigator.clipboard.writeText(output.textContent);
          const originalText = copyBtn.textContent;
          copyBtn.textContent = "Copied!";
          setTimeout(() => {
            copyBtn.textContent = originalText;
          }, 2000);
        } catch (e) {
          alert("Failed to copy to clipboard");
        }
      };
    </script>
  </body>
</html>
