<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASN.1 Graph Viewer - Example</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      asn1-graph-viewer {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Graph Viewer -->
    <asn1-graph-viewer id="graphViewer"></asn1-graph-viewer>

    <!-- Control Panel -->
    <asn1-control-panel id="controlPanel"></asn1-control-panel>

    <!-- Load D3.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <!-- Load and configure components -->
    <script type="module">
      import { ASN1GraphViewer } from "./asn1-graph-viewer.js";
      import { ASN1ControlPanel } from "./asn1-control-panel.js";

      const graphViewer = document.getElementById("graphViewer");
      const controlPanel = document.getElementById("controlPanel");

      // Set graph dimensions
      graphViewer.setAttribute("width", window.innerWidth);
      graphViewer.setAttribute("height", window.innerHeight);

      // Listen for decoded data events from control panel
      controlPanel.addEventListener("decoded", (event) => {
        const data = event.detail.data;
        console.log("Received decoded data:", data);
        graphViewer.setData(data);
      });

      // Handle window resize
      window.addEventListener("resize", () => {
        graphViewer.setAttribute("width", window.innerWidth);
        graphViewer.setAttribute("height", window.innerHeight);
        graphViewer.handleResize();
      });

      // Demo: Load sample data
      window.loadSampleData = function() {
        const sampleData = {
          type: "SEQUENCE",
          tagClass: 0,
          tagNumber: 16,
          tagConstructed: true,
          length: 100,
          subCount: 3,
          sub: [
            {
              type: "INTEGER",
              tagClass: 0,
              tagNumber: 2,
              tagConstructed: false,
              length: 1,
              content: "42"
            },
            {
              type: "OCTET STRING",
              tagClass: 0,
              tagNumber: 4,
              tagConstructed: false,
              length: 11,
              content: "Hello World"
            },
            {
              type: "SEQUENCE",
              tagClass: 0,
              tagNumber: 16,
              tagConstructed: true,
              length: 50,
              subCount: 2,
              sub: [
                {
                  type: "UTF8String",
                  tagClass: 0,
                  tagNumber: 12,
                  tagConstructed: false,
                  length: 10,
                  content: "Test User"
                },
                {
                  type: "UTCTime",
                  tagClass: 0,
                  tagNumber: 23,
                  tagConstructed: false,
                  length: 13,
                  content: "231213120000Z"
                }
              ]
            }
          ]
        };

        graphViewer.setData(sampleData);
        console.log("Sample data loaded!");
      };

      console.log("ASN.1 Graph Viewer Example Ready!");
      console.log("Try: loadSampleData() to see a demo");
      console.log("Or paste hex data in the control panel (Ctrl+K)");
    </script>
  </body>
</html>
