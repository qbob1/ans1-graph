<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASN.1 Graph Viewer - Example</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      asn1-graph-viewer {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Graph Viewer -->
    <asn1-graph-viewer id="graphViewer"></asn1-graph-viewer>

    <!-- Control Panel -->
    <asn1-control-panel id="controlPanel"></asn1-control-panel>

    <!-- Load D3.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <!-- Load and configure components -->
    <script type="module">
      import { ASN1GraphViewer } from "./asn1-graph-viewer.js";
      import { ASN1ControlPanel } from "./asn1-control-panel.js";

      const graphViewer = document.getElementById("graphViewer");
      const controlPanel = document.getElementById("controlPanel");

      // Set graph dimensions
      graphViewer.setAttribute("width", window.innerWidth);
      graphViewer.setAttribute("height", window.innerHeight);

      // Listen for decoded data events from control panel
      controlPanel.addEventListener("decoded", (event) => {
        const data = event.detail.data;
        console.log("Received decoded data:", data);
        graphViewer.setData(data);
      });

      // Handle window resize
      window.addEventListener("resize", () => {
        graphViewer.setAttribute("width", window.innerWidth);
        graphViewer.setAttribute("height", window.innerHeight);
        graphViewer.handleResize();
      });

      // Sample hex data examples
      const sampleHexData = {
        simple: "3024020142040B48656C6C6F20576F726C640C0A546573742055736572",
        customLabels: "30818AA00302010AA1160414757365722D6964656E746966696572A203020104A31A301802010C0413757365722D617474726962757465A4250C23546869732069732061206C6F6E6720757365722064657363726970746F7220737472696E67A52A30280C0A4669727374204E616D650C094C617374204E616D650C0F757365724064796E616D69632E636F6D",
        nested: "3051300F020164040568656C6C6F0201323014020201F4040A746573742076616C7565170D3233313231333132303030305A301E301C020102041654686973206973206120746573742076616C7565"
      };

      // Function to load hex data into control panel
      window.loadHexSample = function(sampleName = 'simple') {
        const hexData = sampleHexData[sampleName];
        if (!hexData) {
          console.error("Unknown sample:", sampleName);
          console.log("Available samples:", Object.keys(sampleHexData));
          return;
        }

        // Get the control panel and set the hex input
        const hexInput = controlPanel.shadowRoot.getElementById('hexInput');
        if (hexInput) {
          hexInput.value = hexData;
          console.log(`Loaded ${sampleName} sample into hex input`);
          console.log("Now click the Decode button in the control panel!");
        } else {
          console.error("Could not find hex input field");
        }
      };

      // Auto-load simple sample on page load
      setTimeout(() => {
        loadHexSample('simple');
        console.log("\n📊 Sample data loaded into control panel!");
        console.log("Open the control panel (Ctrl+K or click ⚙️) and click 'Decode'\n");
      }, 500);

      console.log("ASN.1 Graph Viewer Example Ready!");
      console.log("\nAvailable samples:");
      console.log("  loadHexSample('simple')        - Basic SEQUENCE with INTEGER, OCTET STRING, UTF8String");
      console.log("  loadHexSample('customLabels')  - Test custom labels with context-specific tags");
      console.log("  loadHexSample('nested')        - Nested sequences");
      console.log("\nOr paste your own hex data in the control panel (Ctrl+K)");
    </script>
  </body>
</html>
